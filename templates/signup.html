<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('nav_signup') }} — AgriXAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans Kannada', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #07190d 0%, #0d2816 50%, #051209 100%);
            color: #e2f0e6;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: rgba(9, 32, 18, 0.85);
            border-bottom: 1px solid rgba(34, 197, 94, 0.2);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .nav-brand-logo { font-size: 1.6rem; }
        .nav-brand-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
        }
        .nav-brand-text span { color: #4ade80; }
        .lang-select-form select {
            background: #092014;
            color: #86efac;
            border: 1px solid rgba(74, 222, 128, 0.4);
            border-radius: 8px;
            padding: 0.35rem 0.7rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .signup-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 460px;
            background: rgba(14, 35, 22, 0.9);
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 16px 50px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 1.8rem; }
        .header .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header h1 { font-size: 1.6rem; font-weight: 800; color: #ffffff; }
        .header p { color: #86efac; font-size: 0.85rem; margin-top: 0.3rem; }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            color: #fca5a5;
            text-align: center;
        }

        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #86efac;
            margin-bottom: 0.35rem;
            letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            background: rgba(6, 23, 13, 0.8);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .form-group input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }
        .radio-group { display: flex; gap: 1.5rem; margin-top: 0.3rem; }
        .radio-group label {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.85rem;
            font-weight: 500;
            color: #bbf7d0;
            cursor: pointer;
        }
        .radio-group input[type="radio"] { accent-color: #22c55e; }

        .btn-submit {
            width: 100%;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            margin-top: 1rem;
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
            transition: all 0.2s;
            font-family: inherit;
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
        }
        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .footer-link a { color: #4ade80; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span class="nav-brand-logo">🌾</span>
            <span class="nav-brand-text">Agri<span>XAI</span></span>
        </a>
        <form action="/set_language" method="POST" class="lang-select-form">
            <select name="language" onchange="this.form.submit()" aria-label="Select Language">
                {% for code, name in languages.items() %}
                <option value="{{ code }}" {% if code == current_language %}selected{% endif %}>
                    {{ name }}
                </option>
                {% endfor %}
            </select>
        </form>
    </nav>

    <div class="signup-wrapper">
        <div class="card">
            <div class="header">
                <div class="icon">📝</div>
                <h1>{{ t('nav_signup') }}</h1>
                <p>Create your AgriXAI Account</p>
            </div>

            {% if error %}
            <div class="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/signup" id="signup-form">
                <div class="form-group">
                    <label>Sign Up Method</label>
                    <div class="radio-group">
                        <label>
                            <input type="radio" name="signup_method" value="email" checked onchange="toggleMethod('email')"> Email
                        </label>
                        <label>
                            <input type="radio" name="signup_method" value="phone" onchange="toggleMethod('phone')"> Mobile Number
                        </label>
                    </div>
                </div>

                <div class="form-group" id="email-field">
                    <label>Email Address</label>
                    <input type="email" name="email" id="signup-email" placeholder="farmer@example.com">
                </div>

                <div class="form-group" id="phone-field" style="display:none;">
                    <label>Phone Number (10 digits)</label>
                    <input type="tel" name="phone" id="signup-phone" placeholder="9876543210" pattern="[0-9]{10}">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" name="username" id="signup-username" placeholder="Choose a username" required>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" name="password" id="signup-password" placeholder="••••••••" required>
                </div>

                <div class="form-group">
                    <label>Confirm Password</label>
                    <input type="password" name="confirm_password" id="signup-confirm-password" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn-submit" id="signup-submit-btn">
                    <span>✅</span> Create Account
                </button>
            </form>

            <div class="footer-link">
                Already registered? <a href="/login">{{ t('nav_login') }}</a>
            </div>
        </div>
    </div>

    <script>
        function toggleMethod(method) {
            document.getElementById('email-field').style.display = method === 'email' ? 'block' : 'none';
            document.getElementById('phone-field').style.display = method === 'phone' ? 'block' : 'none';
        }
    </script>
</body>
</html>
