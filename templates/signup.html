<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up — AgriXAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; min-height: 100vh;
            background: linear-gradient(135deg, #0a1f0a 0%, #1a3a1a 30%, #0d2b0d 70%, #061206 100%);
            color: #e0f0e0; display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(34,197,94,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(22,163,74,0.06) 0%, transparent 50%);
        }
        .card {
            position: relative; z-index: 1; width: 100%; max-width: 440px;
            background: rgba(15,30,15,0.85); border: 1px solid rgba(34,197,94,0.15);
            border-radius: 24px; padding: 2.5rem 2rem; backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header h1 {
            font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header p { color: #86efac; font-size: 0.85rem; margin-top: 0.3rem; }
        .error-msg {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1.5rem;
            font-size: 0.85rem; color: #fca5a5; text-align: center;
        }
        .form-group { margin-bottom: 1rem; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: #86efac; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%; padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.95rem;
            background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.2);
            color: #e0f0e0; outline: none; transition: border-color 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus { border-color: #22c55e; }
        .form-group input::placeholder { color: rgba(134,239,172,0.3); }
        .form-group select option { background: #1a3a1a; color: #e0f0e0; }
        .radio-group { display: flex; gap: 1.5rem; margin-top: 0.3rem; }
        .radio-group label {
            display: flex; align-items: center; gap: 0.4rem;
            font-size: 0.85rem; font-weight: 500; color: #86efac;
            cursor: pointer; text-transform: none; letter-spacing: 0;
        }
        .radio-group input[type="radio"] { accent-color: #22c55e; width: 16px; height: 16px; }
        .btn {
            width: 100%; padding: 0.9rem; border-radius: 12px; font-size: 1rem;
            font-weight: 700; border: none; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff;
            box-shadow: 0 4px 20px rgba(34,197,94,0.3); margin-top: 0.5rem;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(34,197,94,0.4); }
        .links {
            text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: rgba(134,239,172,0.5);
        }
        .links a { color: #4ade80; text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="card">
        <div class="header">
            <div class="icon">📝</div>
            <h1>Create Account</h1>
            <p>Join AgriXAI — Crop Yield Advisory System</p>
        </div>

        {% if error %}
        <div class="error-msg" id="signup-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/signup" id="signup-form">
            <div class="form-group">
                <label for="username">Username *</label>
                <input type="text" id="username" name="username" placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label>Sign up with</label>
                <div class="radio-group">
                    <label><input type="radio" name="signup_method" value="email" checked> Email</label>
                    <label><input type="radio" name="signup_method" value="phone"> Phone</label>
                </div>
            </div>

            <div class="form-group" id="email-group">
                <label for="email">Email (Gmail)</label>
                <input type="email" id="email" name="email" placeholder="your.email@gmail.com">
            </div>

            <div class="form-group" id="phone-group" style="display:none;">
                <label for="phone">Phone Number (10 digits)</label>
                <input type="tel" id="phone" name="phone" placeholder="9876543210" maxlength="10">
            </div>

            <div class="form-group">
                <label for="password">Password *</label>
                <input type="password" id="password" name="password" placeholder="Minimum 6 characters" required minlength="6">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password *</label>
                <input type="password" id="confirm_password" name="confirm_password" placeholder="Re-enter password" required>
            </div>

            <button type="submit" class="btn btn-primary" id="signup-submit-btn">📝 Create Account</button>
        </form>

        <div class="links">
            Already have an account? <a href="/login" id="goto-login">Login</a>
            <br><br>
            <a href="/" id="goto-home">← Back to Home</a>
        </div>
    </div>

    <script>
        document.querySelectorAll('input[name="signup_method"]').forEach(radio => {
            radio.addEventListener('change', function() {
                document.getElementById('email-group').style.display = this.value === 'email' ? 'block' : 'none';
                document.getElementById('phone-group').style.display = this.value === 'phone' ? 'block' : 'none';
            });
        });
    </script>
</body>
</html>
