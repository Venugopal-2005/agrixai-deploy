<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — AgriXAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; min-height: 100vh;
            background: linear-gradient(135deg, #0a1f0a 0%, #1a3a1a 30%, #0d2b0d 70%, #061206 100%);
            color: #e0f0e0; display: flex; align-items: center; justify-content: center; padding: 1rem;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(34,197,94,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(22,163,74,0.06) 0%, transparent 50%);
        }
        .card {
            position: relative; z-index: 1; width: 100%; max-width: 440px;
            background: rgba(15,30,15,0.85); border: 1px solid rgba(34,197,94,0.15);
            border-radius: 24px; padding: 2.5rem 2rem; backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header h1 {
            font-size: 1.8rem; font-weight: 800;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .header p { color: #86efac; font-size: 0.85rem; margin-top: 0.3rem; }
        .error-msg {
            background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.3);
            border-radius: 10px; padding: 0.75rem 1rem; margin-bottom: 1.5rem;
            font-size: 0.85rem; color: #fca5a5; text-align: center;
        }
        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: #86efac; margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .form-group input {
            width: 100%; padding: 0.8rem 1rem; border-radius: 10px; font-size: 0.95rem;
            background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.2);
            color: #e0f0e0; outline: none; transition: border-color 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus { border-color: #22c55e; }
        .form-group input::placeholder { color: rgba(134,239,172,0.3); }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 2.5rem; }
        .toggle-pwd {
            position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
            background: none; border: none; color: #86efac; cursor: pointer; font-size: 1.1rem;
        }
        .btn {
            width: 100%; padding: 0.9rem; border-radius: 12px; font-size: 1rem;
            font-weight: 700; border: none; cursor: pointer; transition: all 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff;
            box-shadow: 0 4px 20px rgba(34,197,94,0.3); margin-bottom: 1rem;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(34,197,94,0.4); }
        .divider {
            display: flex; align-items: center; gap: 1rem; margin: 1.2rem 0;
            color: rgba(134,239,172,0.3); font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: ''; flex: 1; height: 1px; background: rgba(34,197,94,0.15);
        }
        .btn-guest {
            background: rgba(34,197,94,0.1); color: #86efac;
            border: 2px solid rgba(134,239,172,0.25);
        }
        .btn-guest:hover { border-color: #86efac; background: rgba(34,197,94,0.15); transform: translateY(-2px); }
        .guest-note {
            text-align: center; font-size: 0.75rem; color: rgba(134,239,172,0.4);
            margin-top: 0.5rem;
        }
        .links {
            text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: rgba(134,239,172,0.5);
        }
        .links a { color: #4ade80; text-decoration: none; font-weight: 600; }
        .links a:hover { text-decoration: underline; }
        .demo-badge {
            display: inline-block; background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3);
            border-radius: 8px; padding: 0.3rem 0.8rem; font-size: 0.7rem; font-weight: 700;
            color: #4ade80; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 0.5rem;
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>
    <div class="card">
        <div class="header">
            <div class="icon">🌾</div>
            <h1>AgriXAI</h1>
            <p>Intelligent Crop Yield Advisory System</p>
        </div>

        {% if error %}
        <div class="error-msg" id="login-error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login" id="login-form">
            <div class="form-group">
                <label for="email">Email (Gmail)</label>
                <input type="email" id="email" name="email" placeholder="your.email@gmail.com" required>
            </div>
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="password-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-pwd" onclick="togglePwd()" id="toggle-pwd-btn" aria-label="Toggle password visibility">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary" id="login-submit-btn">🔐 Login to AgriXAI</button>
        </form>

        <div class="divider">OR</div>

        <a href="/guest" class="btn btn-guest" id="guest-login-btn" style="text-decoration:none;">
            <span class="demo-badge">DEMO ACCESS</span>
            🚀 Continue as Guest
        </a>
        <p class="guest-note">No account required for project demonstration.</p>

        <div class="links">
            Don't have an account? <a href="/signup" id="goto-signup">Sign Up</a>
            <br><br>
            <a href="/" id="goto-home">← Back to Home</a>
        </div>
    </div>

    <script>
        function togglePwd() {
            const inp = document.getElementById('password');
            inp.type = inp.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
