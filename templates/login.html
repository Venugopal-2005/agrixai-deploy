<!DOCTYPE html>
<html lang="{{ current_language }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ t('nav_login') }} — AgriXAI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Kannada:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', 'Noto Sans Kannada', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #07190d 0%, #0d2816 50%, #051209 100%);
            color: #e2f0e6;
            display: flex;
            flex-direction: column;
        }

        /* Navbar */
        .navbar {
            background: rgba(9, 32, 18, 0.85);
            border-bottom: 1px solid rgba(34, 197, 94, 0.2);
            padding: 0.9rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(12px);
        }
        .nav-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
        }
        .nav-brand-logo { font-size: 1.6rem; }
        .nav-brand-text {
            font-size: 1.3rem;
            font-weight: 800;
            color: #ffffff;
        }
        .nav-brand-text span { color: #4ade80; }
        .lang-select-form select {
            background: #092014;
            color: #86efac;
            border: 1px solid rgba(74, 222, 128, 0.4);
            border-radius: 8px;
            padding: 0.35rem 0.7rem;
            font-size: 0.82rem;
            font-weight: 600;
            cursor: pointer;
            outline: none;
            font-family: inherit;
        }

        .login-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2.5rem 1.5rem;
        }
        .card {
            width: 100%;
            max-width: 440px;
            background: rgba(14, 35, 22, 0.9);
            border: 1px solid rgba(74, 222, 128, 0.25);
            border-radius: 20px;
            padding: 2.5rem 2rem;
            box-shadow: 0 16px 50px rgba(0,0,0,0.4);
        }
        .header { text-align: center; margin-bottom: 2rem; }
        .header .icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
        .header h1 {
            font-size: 1.6rem;
            font-weight: 800;
            color: #ffffff;
        }
        .header p { color: #86efac; font-size: 0.85rem; margin-top: 0.3rem; }

        .error-msg {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid rgba(239, 68, 68, 0.35);
            border-radius: 8px;
            padding: 0.75rem 1rem;
            margin-bottom: 1.2rem;
            font-size: 0.85rem;
            color: #fca5a5;
            text-align: center;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #86efac;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }
        .form-group input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 10px;
            font-size: 0.95rem;
            background: rgba(6, 23, 13, 0.8);
            border: 1px solid rgba(74, 222, 128, 0.3);
            color: #ffffff;
            outline: none;
            transition: border-color 0.3s;
            font-family: inherit;
        }
        .form-group input:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
        }
        .password-wrapper { position: relative; }
        .password-wrapper input { padding-right: 2.5rem; }
        .toggle-pwd {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: #86efac;
            cursor: pointer;
            font-size: 1.1rem;
        }

        .btn {
            width: 100%;
            padding: 0.9rem;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            font-family: inherit;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            text-decoration: none;
        }
        .btn-submit {
            background: linear-gradient(135deg, #16a34a, #15803d);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(22, 163, 74, 0.3);
        }
        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(22, 163, 74, 0.4);
        }
        .btn-guest {
            background: rgba(34, 197, 94, 0.15);
            border: 1px solid #4ade80;
            color: #86efac;
            margin-top: 0.8rem;
        }
        .btn-guest:hover {
            background: rgba(34, 197, 94, 0.25);
            transform: translateY(-2px);
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            color: rgba(226, 240, 230, 0.4);
            font-size: 0.8rem;
        }
        .divider::before, .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.1);
        }

        .footer-link {
            text-align: center;
            margin-top: 1.5rem;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        .footer-link a {
            color: #4ade80;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="/" class="nav-brand">
            <span class="nav-brand-logo">🌾</span>
            <span class="nav-brand-text">Agri<span>XAI</span></span>
        </a>
        <form action="/set_language" method="POST" class="lang-select-form">
            <select name="language" onchange="this.form.submit()" aria-label="Select Language">
                {% for code, name in languages.items() %}
                <option value="{{ code }}" {% if code == current_language %}selected{% endif %}>
                    {{ name }}
                </option>
                {% endfor %}
            </select>
        </form>
    </nav>

    <!-- Login Box -->
    <div class="login-wrapper">
        <div class="card">
            <div class="header">
                <div class="icon">👨‍🌾</div>
                <h1>{{ t('nav_login') }}</h1>
                <p>{{ t('app_tagline') }}</p>
            </div>

            {% if error %}
            <div class="error-msg" id="error-msg">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login" id="login-form">
                <div class="form-group">
                    <label>Email / Username</label>
                    <input type="text" name="email_or_username" id="login-identifier" placeholder="Enter username or email" required>
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <div class="password-wrapper">
                        <input type="password" name="password" id="login-password" placeholder="••••••••" required>
                        <button type="button" class="toggle-pwd" onclick="togglePassword('login-password')">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn btn-submit" id="login-submit-btn">
                    <span>🔓</span> {{ t('nav_login') }}
                </button>
            </form>

            <div class="divider">OR / ಅಥವಾ</div>

            <a href="/guest" class="btn btn-guest" id="guest-login-btn">
                <span>⚡</span> Continue as Guest (Demo Access) / ಅತಿಥಿ ಪ್ರವೇಶ
            </a>

            <div class="footer-link">
                Don't have an account? <a href="/signup">{{ t('nav_signup') }}</a>
            </div>
        </div>
    </div>

    <script>
        function togglePassword(id) {
            const input = document.getElementById(id);
            input.type = input.type === 'password' ? 'text' : 'password';
        }
    </script>
</body>
</html>
