<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict — AgriXAI</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif; min-height: 100vh;
            background: linear-gradient(135deg, #0a1f0a 0%, #1a3a1a 30%, #0d2b0d 70%, #061206 100%);
            color: #e0f0e0;
        }
        .bg-pattern {
            position: fixed; inset: 0; z-index: 0;
            background-image:
                radial-gradient(circle at 20% 50%, rgba(34,197,94,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(22,163,74,0.06) 0%, transparent 50%);
        }
        /* Navbar */
        .navbar {
            position: relative; z-index: 10;
            display: flex; align-items: center; justify-content: space-between;
            padding: 1rem 2rem; background: rgba(10,20,10,0.8);
            border-bottom: 1px solid rgba(34,197,94,0.1); backdrop-filter: blur(10px);
        }
        .nav-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .nav-brand span:first-child { font-size: 1.5rem; }
        .nav-brand span:last-child {
            font-size: 1.2rem; font-weight: 800;
            background: linear-gradient(135deg, #4ade80, #22c55e);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .nav-links { display: flex; align-items: center; gap: 1.2rem; }
        .nav-links a {
            color: #86efac; text-decoration: none; font-size: 0.85rem; font-weight: 500;
            padding: 0.4rem 0.8rem; border-radius: 8px; transition: all 0.2s;
        }
        .nav-links a:hover { background: rgba(34,197,94,0.1); }
        .nav-links .user-badge {
            background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.2);
            padding: 0.4rem 0.8rem; border-radius: 20px; font-size: 0.8rem; color: #4ade80;
        }
        .lang-select {
            background: rgba(34,197,94,0.1); border: 1px solid rgba(34,197,94,0.2);
            color: #86efac; padding: 0.3rem 0.5rem; border-radius: 8px; font-size: 0.8rem;
            cursor: pointer; outline: none; font-family: 'Inter', sans-serif;
        }
        .lang-select option { background: #1a3a1a; color: #e0f0e0; }

        /* Main */
        .main {
            position: relative; z-index: 1;
            max-width: 700px; margin: 2rem auto; padding: 0 1.5rem 3rem;
        }
        .page-title {
            text-align: center; margin-bottom: 2rem;
        }
        .page-title h1 {
            font-size: 1.6rem; font-weight: 700; color: #e0f0e0; margin-bottom: 0.3rem;
        }
        .page-title p { font-size: 0.85rem; color: rgba(134,239,172,0.5); }

        .form-card {
            background: rgba(15,30,15,0.85); border: 1px solid rgba(34,197,94,0.12);
            border-radius: 20px; padding: 2rem; backdrop-filter: blur(20px);
            box-shadow: 0 12px 40px rgba(0,0,0,0.3);
        }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
        .form-group { display: flex; flex-direction: column; }
        .form-group.full { grid-column: 1 / -1; }
        .form-group label {
            font-size: 0.78rem; font-weight: 600; color: #86efac;
            margin-bottom: 0.4rem; text-transform: uppercase; letter-spacing: 0.5px;
            display: flex; align-items: center; gap: 0.3rem;
        }
        .form-group input, .form-group select {
            padding: 0.75rem 1rem; border-radius: 10px; font-size: 0.95rem;
            background: rgba(34,197,94,0.06); border: 1px solid rgba(34,197,94,0.18);
            color: #e0f0e0; outline: none; transition: border-color 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .form-group input:focus, .form-group select:focus { border-color: #22c55e; }
        .form-group select option { background: #1a3a1a; color: #e0f0e0; }
        .form-group input::placeholder { color: rgba(134,239,172,0.3); }
        .btn-predict {
            width: 100%; padding: 1rem; border-radius: 14px; font-size: 1.05rem;
            font-weight: 700; border: none; cursor: pointer; margin-top: 1.5rem;
            background: linear-gradient(135deg, #22c55e, #16a34a); color: #fff;
            box-shadow: 0 6px 24px rgba(34,197,94,0.3); transition: all 0.3s;
            font-family: 'Inter', sans-serif;
            display: flex; align-items: center; justify-content: center; gap: 0.5rem;
        }
        .btn-predict:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(34,197,94,0.4); }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
            .navbar { padding: 0.8rem 1rem; flex-wrap: wrap; gap: 0.5rem; }
        }
    </style>
</head>
<body>
    <div class="bg-pattern"></div>

    <nav class="navbar">
        <a href="/predict" class="nav-brand">
            <span>🌾</span>
            <span>AgriXAI</span>
        </a>
        <div class="nav-links">
            <form method="POST" action="/set_language" style="display:inline;">
                <select name="language" class="lang-select" onchange="this.form.submit()" id="lang-selector">
                    {% for code, name in languages.items() %}
                    <option value="{{ code }}" {% if code == current_language %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </form>
            <span class="user-badge" id="user-badge">👤 {{ username }}</span>
            <a href="/profile" id="nav-profile">{{ t('nav_profile') }}</a>
            <a href="/logout" id="nav-logout">{{ t('nav_logout') }}</a>
        </div>
    </nav>

    <div class="main">
        <div class="page-title">
            <h1>🌿 {{ t('predict_enter_farm_details') }}</h1>
            <p>{{ t('app_tagline') }}</p>
        </div>

        <div class="form-card">
            <form method="POST" action="/predict" id="predict-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label>🌱 {{ t('predict_label_crop') }}</label>
                        <select name="Crop" id="crop-select" required>
                            <option value="">-- Select Crop --</option>
                            {% for c in crops %}
                            <option value="{{ c }}">{{ c }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🌦 {{ t('predict_label_season') }}</label>
                        <select name="Season" id="season-select" required>
                            <option value="">-- Select Season --</option>
                            {% for s in seasons %}
                            <option value="{{ s }}">{{ s }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group full">
                        <label>📍 {{ t('predict_label_state') }}</label>
                        <select name="State" id="state-select" required>
                            <option value="">-- Select State --</option>
                            {% for st in states %}
                            <option value="{{ st }}">{{ st }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label>🌾 {{ t('predict_label_area') }}</label>
                        <input type="number" name="Area" id="area-input" placeholder="e.g. 1000" step="any" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>🌧 {{ t('predict_label_rainfall') }}</label>
                        <input type="number" name="Annual_Rainfall" id="rainfall-input" placeholder="e.g. 1200" step="any" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>🧪 {{ t('predict_label_fertilizer') }}</label>
                        <input type="number" name="Fertilizer" id="fertilizer-input" placeholder="e.g. 50000" step="any" min="0" required>
                    </div>
                    <div class="form-group">
                        <label>🐛 {{ t('predict_label_pesticide') }}</label>
                        <input type="number" name="Pesticide" id="pesticide-input" placeholder="e.g. 500" step="any" min="0" required>
                    </div>
                </div>
                <button type="submit" class="btn-predict" id="predict-btn">🌿 {{ t('predict_button_predict') }}</button>
            </form>
        </div>
    </div>
</body>
</html>
